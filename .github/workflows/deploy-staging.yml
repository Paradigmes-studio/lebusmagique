name: Deploy on Staging Environment
run-name: "${{ github.actor }} is deploying on staging environment 🧪"
on:
  push:
    branches:
      - develop

jobs:
  deploy-theme:
    name: "Deploy on staging server (seopress)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install Composer dependencies"
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # --- Option Tailscale ---------------------------------------------------
      # Si le SSH public de seopress est restreint par IP (les runners GitHub ne
      # peuvent pas être whitelistés), décommenter ce bloc : le runner rejoint le
      # tailnet et SEOPRESS_SSH_HOST doit alors pointer sur l'adresse Tailscale
      # du serveur (100.x / MagicDNS) plutôt que sur l'IP publique.
      # Nécessite les secrets TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET et une ACL
      # autorisant tag:ci -> seopress:2222.
      #
      # - name: Connect to Tailscale
      #   uses: tailscale/github-action@v3
      #   with:
      #     oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      #     oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      #     tags: tag:ci
      # ------------------------------------------------------------------------

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SEOPRESS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p 2222 -H "${{ secrets.SEOPRESS_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy theme via rsync
        run: |
          rsync -az \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.sass-cache' \
            --exclude='*.map' \
            -e "ssh -i ~/.ssh/id_deploy -p 2222" \
            ./ \
            "${{ secrets.SEOPRESS_SSH_USERNAME }}@${{ secrets.SEOPRESS_SSH_HOST }}:${{ secrets.STAGING_REMOTE_PATH }}"
